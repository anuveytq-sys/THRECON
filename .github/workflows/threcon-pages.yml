name: THRECON — Build & Deploy GitHub Pages
on:
  push:
    branches: [main, stage-1-sci-fi-studio, stage-2-photo-intelligence, stage-3-reconstruction-repair, fix-vision-inference-backend, fix-depth-backend-regions, fix-mobile-depth-inference-and-reconstruction]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate local Python API syntax
        run: python -m compileall -q local-engine/app
      - name: Production build
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: threcon-pages-deploy
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
